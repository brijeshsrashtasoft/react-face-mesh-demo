services:
  react-face-mesh-dev:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: react-mediapipe-face-mesh-dev
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true